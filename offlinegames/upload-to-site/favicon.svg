<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a2d3d" />
      <stop offset="100%" stop-color="#111319" />
    </radialGradient>

    <!-- App Icon Base Clip (Squircle) -->
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115" />
    </clipPath>

    <!-- Mosaic Tile Pattern -->
    <pattern id="mosaic" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="16" height="16" rx="3" fill="#ff4757" opacity="0.6"/>
      <rect x="22" y="2" width="16" height="16" rx="3" fill="#2ed573" opacity="0.6"/>
      <rect x="2" y="22" width="16" height="16" rx="3" fill="#ffa502" opacity="0.6"/>
      <rect x="22" y="22" width="16" height="16" rx="3" fill="#1e90ff" opacity="0.6"/>
    </pattern>

    <!-- Fisheye / Sphere Overlay Effect -->
    <radialGradient id="sphereShade" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </radialGradient>
  </defs>

  <!-- Main Container -->
  <g clip-path="url(#squircle)">
    <!-- Dark Background -->
    <rect width="512" height="512" fill="url(#bgGrad)" />

    <!-- Game Mosaic Background Layer -->
    <rect width="512" height="512" fill="url(#mosaic)" opacity="0.45" />

    <!-- Radial Vignette for Depth -->
    <rect width="512" height="512" fill="url(#sphereShade)" />

    <!-- No Wi-Fi Icon Group -->
    <g transform="translate(256, 210)" stroke="#ffffff" stroke-width="26" stroke-linecap="round" fill="none">
      <!-- Outer Arc -->
      <path d="M -90,-20 A 110,110 0 0,1 90,-20" />
      <!-- Middle Arc -->
      <path d="M -60,20 A 70,70 0 0,1 60,20" />
      <!-- Inner Arc -->
      <path d="M -30,60 A 35,35 0 0,1 30,60" />
      <!-- Center Dot -->
      <circle cx="0" cy="95" r="5" fill="#ffffff" />

      <!-- Slash Line (No Connection) -->
      <line x1="-100" y1="110" x2="100" y2="-50" stroke="#ffffff" stroke-width="32" />
      <!-- Dark outline cut out for slash clarity -->
      <line x1="-100" y1="110" x2="100" y2="-50" stroke="#111319" stroke-width="12" />
    </g>

    <!-- Text Element -->
    <text x="256" y="420" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="76" 
          font-weight="900" 
          fill="#ffffff" 
          stroke="#000000" 
          stroke-width="8" 
          paint-order="stroke fill" 
          text-anchor="middle" 
          letter-spacing="2">
      70000000
    </text>
  </g>
</svg>

  <script>
  (function () {
    var SA = window.SiteAdmin;
    var games = (window.SITE_GAMES || []).slice();
    var news = (window.SITE_NEWS || []).slice();

    /* WAS: this page merged a localStorage snapshot ("og-catalog-draft") over
     * the freshly downloaded catalog, and persist() wrote that snapshot back.
     * Because render() runs on every load, every visitor ended up storing one.
     *
     * The merge kept the server's copy for any id it already had, then
     * appended every id the snapshot had that the server did not — so a news
     * post or game you DELETED came straight back out of the visitor's own
     * localStorage on every future visit. Incognito looked right because
     * incognito has no localStorage to merge.
     *
     * catalog.js is the only source of truth now. Any snapshot left over from
     * the old code is deleted here, so already-affected browsers heal
     * themselves on the next load. */
    try { localStorage.removeItem("og-catalog-draft"); } catch (e) {}

    function persist() {
      try {
        /* Only useful while you are mid-edit in the admin panel. Writing it
           for ordinary visitors is what caused deleted posts to reappear. */
        if (SA && SA.isAdmin && SA.isAdmin()) {
          localStorage.setItem("og-catalog-draft", JSON.stringify({ games: games, news: news }));
        }
      } catch (e) {}
    }

    function render() {
      var admin = SA && SA.isAdmin && SA.isAdmin();
      var sorted = news.slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
      var html = admin
        ? '<button type="button" class="add-news-card" id="add-news"><span>＋</span><span>Add News Post</span></button>'
        : "";
      html += sorted.map(function (n) {
        var d = new Date(n.date);
        var ds = isNaN(d) ? n.date : d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
        var actions = admin
          ? '<div class="cart-admin-actions">' +
              '<button type="button" class="icon-btn" data-edit="' + n.id + '">✎</button>' +
              '<button type="button" class="icon-btn danger" data-del="' + n.id + '">✕</button></div>'
          : "";
        var thumb = n.image
          ? '<img src="' + n.image + '" alt="">'
          : (n.emoji || "✦");
        return '<article class="news-card">' + actions +
          '<div class="thumb">' + thumb + "</div>" +
          '<div class="body"><span class="badge date">' + ds + "</span><h3>" + n.title + "</h3><p>" + (n.excerpt || "") + "</p></div></article>";
      }).join("");
      document.getElementById("news-list").innerHTML = html;
      document.getElementById("lib-save-exit").hidden = !admin;
      var add = document.getElementById("add-news");
      if (add) add.onclick = function () {
        window.AdminForms.openNewsForm(null, function (record) { news.push(record); persist(); render(); });
      };
      document.getElementById("news-list").onclick = function (e) {
        var ed = e.target.closest("[data-edit]");
        var dl = e.target.closest("[data-del]");
        if (ed) {
          var n = news.find(function (x) { return x.id === ed.getAttribute("data-edit"); });
          window.AdminForms.openNewsForm(n, function (record) {
            var i = news.findIndex(function (x) { return x.id === record.id; });
            if (i >= 0) news[i] = record;
            persist();
            render();
          });
        }
        if (dl) {
          var n2 = news.find(function (x) { return x.id === dl.getAttribute("data-del"); });
          window.AdminForms.confirmDelete(n2.title, function () {
            news = news.filter(function (x) { return x.id !== n2.id; });
            persist();
            render();
          });
        }
      };
    }

    document.getElementById("lib-save-exit").onclick = function () {
      window.AdminForms.downloadCatalog(games, news);
    };
    if (location.hash === "#admin06") {
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
      if (SA && !SA.isAdmin()) SA.promptSignIn(render);
    }
    render();
  })();
  </script>

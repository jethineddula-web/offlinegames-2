<body>
<div id="bg"></div>

<!-- =================== TITLE SCREEN =================== -->
<section id="screen-title" class="screen active">
  <div id="float-layer"></div>
  <div class="title-box">
    <div class="logo"><span class="logo-emoji">🧩</span><div class="logo-text"><h1>PUZZLE&nbsp;BREAK</h1><p>50 jigsaw adventures</p></div></div>
    <button id="btn-play" class="btn btn-primary big">▶&nbsp; Play</button>
    <button id="btn-levels" class="btn big">🗺&nbsp; Level Select</button>
    <button id="btn-sound-title" class="btn">🔊&nbsp; Sound: On</button>
    <p class="tip">👀 Watch the picture for 2 seconds — then it shatters!<br>Rebuild it piece by piece 🧩✨</p>
  </div>
</section>

<!-- =================== LEVEL SELECT =================== -->
<section id="screen-levels" class="screen">
  <div class="panel">
    <div class="panel-head">
      <button id="btn-back-title" class="btn small">◀ Back</button>
      <h2>Level Select</h2>
      <div class="stars-total" id="stars-total"></div>
    </div>
    <div id="level-grid" class="level-grid"></div>
    <div id="ad-slot-levels" class="ad-slot"></div>
  </div>
</section>

<!-- =================== GAME =================== -->
<section id="screen-game" class="screen">
  <div class="hud">
    <div class="hud-left">
      <button id="btn-back-levels" class="btn tiny" title="Back to levels">◀</button>
      <div class="chip big">Lv <b id="hud-level">1</b></div>
      <div class="chip" id="hud-theme"></div>
    </div>
    <div class="hud-center">
      <div class="chip">🎯 <b id="hud-moves">0</b></div>
      <div class="chip">⏱ <b id="hud-time">0:00</b></div>
      <div class="chip" id="hud-progress">🧩 0/4</div>
    </div>
    <div class="hud-right">
      <button id="btn-ref" class="btn tiny" title="Guide picture">🖼</button>
      <button id="btn-hint" class="btn tiny" title="Hint (1 per level)">💡</button>
      <button id="btn-sound-game" class="btn tiny" title="Sound">🔊</button>
    </div>
  </div>

  <div id="game">
    <div id="spacer"></div>

    <div id="tray">
      <div class="tray-title">Your Pieces <span id="tray-count">· 0/4</span></div>
      <div id="tray-area"></div>
    </div>

    <div id="board-frame">
      <div id="slots-layer"></div>
      <div id="flash"></div>
    </div>

    <div id="peek-img"></div>
    <div id="ref-img"></div>
    <div id="memorize-label">👀 Memorize!</div>
    <div id="memorize-bar"><div></div></div>
    <div id="pieces-layer"></div>
  </div>

  <div id="complete-panel" class="overlay">
    <div class="panel pop">
      <div class="big-emoji">🎉</div>
      <h2 id="complete-title">Level Complete!</h2>
      <div class="stars" id="complete-stars"></div>
      <div class="stats">
        <div class="stat"><span>🎯 Moves</span><b id="stat-moves">0</b></div>
        <div class="stat"><span>⏱ Time</span><b id="stat-time">0:00</b></div>
        <div class="stat"><span>🧩 Pieces</span><b id="stat-pieces">0</b></div>
      </div>
      <div id="new-best" class="new-best">⭐ NEW BEST! ⭐</div>
      <div class="btns">
        <button id="btn-replay" class="btn">🔁 Replay</button>
        <button id="btn-next" class="btn btn-primary">▶ Next Level</button>
      </div>
      <button id="btn-to-levels" class="btn small ghost">🗺 All Levels</button>
    </div>
  </div>
</section>

<canvas id="fx"></canvas>

<script src="images.js"></script>
<script src="game.js"></script>
</body>
</html>

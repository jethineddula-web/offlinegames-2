<body>
  <div class="bg">
    <div class="orb x"></div>
    <div class="orb o"></div>
    <div class="orb w"></div>
    <div id="floatMarks"></div>
  </div>

  <div class="app">
    <section id="startScreen" class="screen start active">
      <div class="logo-wrap">
        <div class="brand-logo-frame">
          <img class="brand-logo" src="logo.png" alt="Tic Tac Toe" />
        </div>
        <h1 class="logo" id="logoTitle"></h1>
      </div>
      <p class="tagline">Classic. Fast. Addictive.</p>
      <div class="panel">
        <button class="btn" id="btnPvp">Play vs Friend</button>
        <button class="btn pink" id="btnAi">Play vs Computer</button>
        <div class="diff" id="diffBox">
          <label>Difficulty</label>
          <div class="chips">
            <button class="chip" data-diff="easy">Easy</button>
            <button class="chip on" data-diff="medium">Medium</button>
            <button class="chip" data-diff="hard">Hard</button>
          </div>
          <button class="btn" id="btnStartAi" style="margin-top:12px">Start Match</button>
        </div>
        <div class="toggles">
          <span>Sound</span>
          <div class="toggle on" id="soundToggle"><i></i></div>
        </div>
      </div>
    </section>

    <section id="gameScreen" class="screen game">
      <div class="topbar">
        <div class="brand-mini"><img src="logo.png" alt="" />TIC <em>TAC</em> TOE</div>
        <button class="btn ghost small" id="btnMenu">Menu</button>
      </div>
      <div class="scores">
        <div class="score-card x"><b id="scoreX">0</b><span id="labelX">You (X)</span></div>
        <div class="score-card"><b id="scoreD">0</b><span>Draws</span></div>
        <div class="score-card o"><b id="scoreO">0</b><span id="labelO">CPU (O)</span></div>
      </div>
      <div class="status" id="status">X to play</div>
      <div class="board-wrap" id="boardWrap">
        <div class="board" id="board"></div>
      </div>
      <div class="actions">
        <button class="btn ghost" id="btnRestart">New Round</button>
        <button class="btn" id="btnResetScores">Reset Score</button>
      </div>
    </section>

    <div class="ad-wrap" id="adWrap">
      <ins class="adsbygoogle"
           style="display:block;width:100%;min-height:60px"
           data-ad-client="ca-pub-4203857211510947"
           data-ad-slot="7417753724"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <div class="ad-fallback" id="adFallback" style="display:none">Advertisement</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">You Win</h2>
      <p id="modalText">Nice board control.</p>
      <button class="btn" id="modalAgain">Play Again</button>
      <button class="btn ghost" id="modalMenu" style="margin-top:10px">Back to Menu</button>
    </div>
  </div>
  <div class="confetti" id="confetti"></div>

  <script src="game.js"></script>

</body>

        <div class="ad-push">${adSlot("banner")}</div></div>`;
      app.querySelector("#bots").onclick = () => { unlock(); startMusic(); S.click(); G.screen="bots"; render(); };
      app.querySelector("#friends").onclick = () => { unlock(); startMusic(); S.click(); G.screen="friends"; render(); };
      app.querySelector("#mute").onclick = () => { unlock(); G.muted=!G.muted; setMute(G.muted); render(); };
      fillAds();
      return;
    }
    if (G.screen==="friends") {
      stopTimers();
      app.innerHTML = `<div class="friends"><div class="fcard">
        <button class="fback" id="back">Back</button>
        <h1 class="ftitle">Friends</h1>
        <p class="flead">Same device, or a table code on this game — hosted here or at offlinegames.art.</p>
        <label><span class="flabel">Your name</span>
          <input class="ffield" id="nm" maxlength="18" value="${G.name}" /></label>
        <button class="fpri" id="hotseat">Same device</button>
        <button class="fgh" id="host">Host a table</button>
        <label style="display:block;margin-top:1.4rem"><span class="flabel">Join code</span>
          <input class="ffield" id="code" maxlength="4" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="K7MQ" value="${G.joinCode||""}" style="font-family:IBM Plex Mono,ui-monospace,monospace;letter-spacing:.35em;text-transform:uppercase" /></label>
        <button class="fgh" id="join" ${ (G.joinCode||"").length<4 ? "disabled":"" }>Join table</button>
      </div>
      <div class="ad-push" style="width:min(26rem,100%);margin:.8rem auto 0">${adSlot("banner")}</div></div>`;
      const nm = app.querySelector("#nm");
      const codeEl = app.querySelector("#code");
      app.querySelector("#back").onclick = () => { G.screen="menu"; render(); };
      nm.oninput = e => G.name = e.target.value;
      codeEl.oninput = e => {
        const raw = e.target.value.replace(/[^A-Za-z0-9]/g,"").toUpperCase().slice(0,4);
        G.joinCode = raw;
        if (codeEl.value !== raw) {
          codeEl.value = raw;
          try { codeEl.setSelectionRange(raw.length, raw.length); } catch (err) {}
        }
        app.querySelector("#join").disabled = raw.length < 4;
      };
      codeEl.onkeydown = e => { if (e.key === "Enter" && G.joinCode.length >= 4) app.querySelector("#join").click(); };
      app.querySelector("#hotseat").onclick = () => { G.screen="hotseat"; render(); };
      app.querySelector("#host").onclick = () => {
        unlock(); S.click();
        G.name = (nm.value || "You").trim();
        const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        G.tableCode = Array.from({length:4},()=>a[Math.floor(Math.random()*a.length)]).join("");
        G.hosting = true;
        G.screen="hosted"; render();
      };
      app.querySelector("#join").onclick = () => {
        unlock(); S.click();
        G.name = (nm.value || "You").trim();
        G.tableCode = G.joinCode;
        G.hosting = false;
        G.screen="hosted"; render();
      };
      fillAds();
      return;
    }
    if (G.screen==="hotseat") {
      stopTimers();
      app.innerHTML = `<div class="friends"><div class="fcard">
        <button class="fback" id="back">Back</button>
        <h1 class="ftitle">Same device</h1>
        <p class="flead">Pass the phone each turn. 2 to 4 players on this screen.</p>
        <span class="flabel">Players</span>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem">
          ${[2,3,4].map(n=>`<button class="fchip ${G.humans===n?"on":""}" data-h="${n}">${n}</button>`).join("")}
        </div>
        <button class="fpri" id="go">Start match</button>
      </div></div>`;
      app.querySelector("#back").onclick = () => { G.screen="friends"; render(); };
      app.querySelectorAll("[data-h]").forEach(b => b.onclick = () => { G.humans=+b.dataset.h; render(); });
      app.querySelector("#go").onclick = () => {
        unlock(); S.click();
        const names = [G.name, ...Array.from({length:G.humans-1}, (_,i)=>"Player "+(i+2))];
        G.state = createGame(G.humans, 0, names, Array(G.humans).fill("human"));
        G.mode="hotseat"; G.self=0; G.screen="play"; render();
      };
      return;
    }
    if (G.screen==="hosted") {
      stopTimers();
      if (!net || net.code !== G.tableCode) openNet(G.tableCode, G.hosting, G.name);
      const pretty = (G.tableCode||"").split("").join(" ");
      app.innerHTML = `<div class="friends"><div class="fcard">
        <button class="fback" id="back">Back</button>
        <p class="flabel">${G.hosting?"You are the host":"Waiting for host"}</p>
        <h1 class="ftitle">Table</h1>
        <p class="flead">Friends open this same page on another phone and type the code. Keep both screens open. You are ${G.name}.</p>
        <div style="display:flex;justify-content:space-between;align-items:center;background:rgb(0 0 0 / .25);border-radius:18px;padding:.85rem 1rem">
          <div><span class="flabel">Table code</span><div style="font-family:IBM Plex Mono,ui-monospace,monospace;font-size:1.6rem;letter-spacing:.28em">${pretty}</div></div>
          <button class="fgh" id="copy" style="width:auto;height:2.6rem;padding:0 1rem;margin:0">Copy</button>
        </div>
        <p class="hint" id="lobby-net" style="margin-top:1rem">Looking for the table…</p>
        <div id="seats"></div>
        ${G.hosting
          ? `<button class="fpri" id="start-host" disabled>Start match</button>`
          : `<p class="hint" style="text-align:center;margin-top:1.4rem">The host will start the match.</p>`}
        <button class="fgh" id="retry-link">Retry link</button>
        <button class="fgh" id="local">Play on this phone instead</button>
      </div></div>`;
      app.querySelector("#back").onclick = () => { closeNet(); G.screen="friends"; render(); };
      app.querySelector("#copy").onclick = async () => {
        try { await navigator.clipboard.writeText(G.tableCode); } catch(e) {}
      };
      app.querySelector("#retry-link").onclick = () => {
        unlock(); S.click();
        openNet(G.tableCode, G.hosting, G.name);
        paintLobby();
      };
      app.querySelector("#local").onclick = () => { closeNet(); G.screen="hotseat"; render(); };
      const go = app.querySelector("#start-host");
      if (go) go.onclick = () => {
        if (!net || !net.isHost || net.lobby.length < 2) return;
        unlock(); S.click();
        const humans = net.lobby.slice(0,4);
        const kinds = humans.map(p => p.id === net.selfId ? "human" : "remote");
        const names = humans.map(p => p.name);
        const peerIds = humans.map(p => p.id);
        while (kinds.length < 2) { kinds.push("bot"); names.push("Bot"); peerIds.push(undefined); }
        const bots = kinds.filter(k => k==="bot").length;
        G.state = createGame(humans.length, bots, names, kinds, peerIds);
        G.self = 0;
        G.mode = "online";
        G.hosting = true;
        const seats = {};
        humans.forEach((p,i) => seats[p.id] = i);
        sendNet({ t:"start", state: G.state, seats });
        G.screen = "play"; render();
      };
      paintLobby();
      return;
    }
    if (G.screen==="bots") {
      stopTimers();
      const bot = G.screen==="bots";
      app.innerHTML = `<div class="wrap"><button class="btn ghost" id="back">Back</button>
        <p class="kicker">${bot?"Solo table":"Shared table"}</p>
        <h1>${bot?"Play with bots":"Play with friends"}</h1>
        <p class="lead">${bot?"Pick a difficulty. Bots take the other colours.":"Pass the device. Each player rolls and moves on their turn."}</p>
        <label class="kicker" style="display:block;margin-top:1.5rem">Your name
          <input id="nm" type="text" maxlength="18" value="${G.name}" /></label>
        ${bot?`<p class="kicker" style="margin-top:1.4rem">Opponents</p>
          <div class="seg three">${[1,2,3].map(n=>`<button class="chip ${G.bots===n?"on":""}" data-b="${n}">${n} bot${n>1?"s":""}</button>`).join("")}</div>`:
          `<p class="kicker" style="margin-top:1.4rem">Players</p>
          <div class="seg three">${[2,3,4].map(n=>`<button class="chip ${G.humans===n?"on":""}" data-h="${n}">${n}</button>`).join("")}</div>`}
        ${bot?`<p class="kicker" style="margin-top:1.4rem">Bot difficulty</p>
          <div class="seg three">${["easy","medium","hard"].map(d=>`<button class="chip ${G.diff===d?"on":""}" data-d="${d}">${d[0].toUpperCase()+d.slice(1)}</button>`).join("")}</div>
          <p class="hint">${G.diff==="easy"?"Bots move at random and miss captures.":G.diff==="medium"?"Bots leave the yard, capture, and push home.":"Bots weigh safety, blocks, and finishing."}</p>`:""}
        <button class="btn wide" id="go" style="margin-top:2rem">Start match</button>
        <div class="ad-push">${adSlot("banner")}</div></div>`;
      app.querySelector("#back").onclick = () => { G.screen="menu"; render(); };
      app.querySelector("#nm").oninput = e => G.name = e.target.value;
      app.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { G.bots=+b.dataset.b; render(); });
      app.querySelectorAll("[data-h]").forEach(b => b.onclick = () => { G.humans=+b.dataset.h; render(); });
      app.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { G.diff=b.dataset.d; render(); });
      app.querySelector("#go").onclick = () => {
        unlock(); S.click();
        G.name = (app.querySelector("#nm").value || "You").trim();
        G.shown = null;
        if (bot) {
          G.mode="bots"; G.self=0;
          G.state = createGame(1, G.bots, [G.name]);
        } else {
          G.mode="hotseat";
          const names = [G.name, ...Array.from({length:G.humans-1}, (_,i)=>"Player "+(i+2))];
          G.state = createGame(G.humans, 0, names, Array(G.humans).fill("human"));
          G.self = 0;
        }
        G.screen="play"; render();
      };
      fillAds();
      return;
    }
    drawPlay();
  }

  function isSelfTurn(s) {
    const p = s.players[s.current];
    if (!p) return false;
    if (G.mode==="hotseat") return p.kind==="human";
    if (G.mode==="online") return s.current===G.self && p.kind!=="bot";
    return s.current===G.self && p.kind!=="bot";
  }
  function showClock(s) {
    return s && s.phase!=="gameover" && isSelfTurn(s);
  }

  function drawPlay() {
    const s = G.state; const pad=2.8, inner=100-pad*2, size=inner/15;
    let cells = "";
    for (let r=0;r<15;r++) for (let c=0;c<15;c++) {
      const k = r+","+c; const home = HOME_SET[k];
      if (home) cells += `<div class="cell"><span class="fill" style="background:${HEX[home]}"></span></div>`;
      else if (PATH_SET.has(k)) {
        const g = PATH.findIndex(p => p[0]===r && p[1]===c);
        cells += `<div class="cell path">${SAFE.has(g)?`<span class="star"></span>`:""}<span class="fill"></span></div>`;
      } else cells += `<div class="cell"></div>`;
    }
    const yards = COLORS.map(col => {
      const [r0,c0]=YB[col];
      return `<div class="yard" style="left:${pad+c0*size}%;top:${pad+r0*size}%;width:${size*6}%;height:${size*6}%;background:${HEX[col]}"><i></i></div>`;
    }).join("");
    const cx = pad+6*size, cw=size*3;
    const center = `<div class="center" style="left:${cx}%;top:${cx}%;width:${cw}%;height:${cw}%">
      <span style="background:${HEX.yellow};clip-path:polygon(0 0,100% 0,50% 50%)"></span>
      <span style="background:${HEX.blue};clip-path:polygon(100% 0,100% 100%,50% 50%)"></span>
      <span style="background:${HEX.red};clip-path:polygon(0 100%,100% 100%,50% 50%)"></span>
      <span style="background:${HEX.green};clip-path:polygon(0 0,0 100%,50% 50%)"></span></div>`;
    const selfTurn = isSelfTurn(s);
    const tokens = s.tokens.map(t => {
      const legalMove = !G.rolling && !G.busy && selfTurn && s.phase==="picking" && s.legal.includes(t.id);
      return `<button class="token ${legalMove?"legal":""}" data-id="${t.id}" style="${pos(t, s)}" ${legalMove?"":"disabled"}>${pawn(t.color, t.id)}</button>`;
    }).join("");
    const clockOn = showClock(s);
    const rows = s.players.map(p => {
      const mine = s.tokens.filter(t=>t.player===p.id);
      const home = mine.filter(t=>t.index>=FINISH).length;
      const out = mine.filter(t=>t.index>=0 && t.index<FINISH).length;
      const on = s.current===p.id && s.phase!=="gameover";
      const place = s.winners.indexOf(p.id);
      return `<div class="row ${on?"on":""}"><div style="width:2.6rem">${pawn(p.color, "s"+p.id)}</div>
        <div style="flex:1"><b>${p.name}</b> ${place>=0?`<small>${place+1}</small>`:""}${on && clockOn?` <span data-clock style="font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted)">${G.remain}s</span>`:""}<div style="font-size:11px;color:var(--subtle-fg);text-transform:uppercase">${p.color} · ${p.kind==="bot"?"Bot":"Player"}</div></div>
        <div class="nums"><div><small>Home</small>${home}</div><div><small>Out</small>${out}</div><div><small>Take</small>${p.captures}</div></div></div>`;
    }).join("");
    const chips = s.players.map(p => {
      const mine = s.tokens.filter(t=>t.player===p.id);
      const home = mine.filter(t=>t.index>=FINISH).length;
      const on = s.current===p.id && s.phase!=="gameover";
      const right = on && clockOn ? `${G.remain}s` : `${home}/4`;
      return `<li class="pchip ${on?"on":""}"><span class="pdot" style="background:${HEX[p.color]}"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</span><span ${on&&clockOn?'data-clock':''} style="font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted)">${right}</span></li>`;
    }).join("");
    const shown = G.rolling ? null : (s.dice || G.shown);
    const face = shown || 1;
    const over = s.phase==="gameover" ? `<div class="overlay"><div class="card"><p class="kicker">Final ranking</p>
      <h2>${s.players[s.winners[0]].name} wins</h2>
      <ol>${s.winners.map((id,i)=>`<li style="display:flex;justify-content:space-between;padding:.6rem 0">${i+1}. ${s.players[id].name}<span style="color:var(--muted)">${s.players[id].captures} takes</span></li>`).join("")}</ol>
      <div class="ad-gap"></div>${adSlot("inter")}
      <button class="btn wide" id="menu" style="margin-top:1.5rem">Back to menu</button></div></div>` : "";
    const turn = s.phase==="gameover"?"Match over": s.phase==="nomove" ? (shown ? "Rolled "+shown : "No moves") : selfTurn && s.phase==="rolling" ? "Your roll" : selfTurn && s.phase==="picking" ? "Tap a glowing coin" : s.players[s.current].name+"'s turn";
    const col = HEX[s.players[s.current].color];
    const clockHtml = clockOn ? `<div class="clock" aria-label="${G.remain} seconds left">
      <span class="clock-num" style="color:${col}">${G.remain}</span>
      <div class="clock-track"><div class="clock-fill" style="width:${Math.max(2,(G.remain/TURN)*100)}%;background:${col}"></div></div>
      <span class="clock-unit">sec</span></div>` : "";
    app.innerHTML = `<div class="play">
      <div class="play-bar"><span class="kicker">Ludo</span>
        ${clockOn?`<span class="bar-clock">${G.remain}s</span>`:`<span></span>`}
        <div><button class="btn ghost" id="mute2">${G.muted?"Unmute":"Mute"}</button>
        <button class="btn ghost" id="leave-m">Leave</button></div></div>
      <div class="play-score score"><div style="display:flex;justify-content:space-between;align-items:end;margin-bottom:.6rem"><h2 style="margin:0;font-size:1.1rem">Scoreboard</h2><span class="hint">Home · Out · Takes</span></div>${rows}
        <button class="btn sec" id="leave" style="width:100%;height:2.8rem;margin-top:.8rem;border-radius:14px">Leave</button></div>
      <div class="play-stage"><div class="board-wrap"><div class="board">${yards}${center}${cells}<div class="token-layer">${tokens}</div></div></div></div>
      <div class="play-hud">${clockHtml}<p class="msg">${s.event}</p>
        <div class="dice-wrap">
          <button class="dice ${G.rolling?"roll":""}" id="dice" ${(!selfTurn || s.phase!=="rolling" || G.rolling || G.busy)?"disabled":""}>${dieSVG(face)}</button>
          <p class="readout">${G.rolling?"…": (shown || "Tap")}</p>
        </div>
        <p class="hint" style="text-align:center;letter-spacing:.08em;text-transform:uppercase">${turn}</p></div>
      <div class="play-rail">${adSlot("rail")}</div>
      <ol class="play-chips chips">${chips}</ol>
      <div class="play-ad">${adSlot("banner")}</div>
    </div>${over}`;
    const leave = () => { stopTimers(); closeNet(); G.screen="menu"; G.state=null; render(); };
    const leaveBtn = app.querySelector("#leave"); if (leaveBtn) leaveBtn.onclick = leave;
    const leaveM = app.querySelector("#leave-m"); if (leaveM) leaveM.onclick = leave;
    const mute2 = app.querySelector("#mute2"); if (mute2) mute2.onclick = () => { unlock(); G.muted=!G.muted; setMute(G.muted); render(); };
    const menu = app.querySelector("#menu"); if (menu) menu.onclick = leave;
    const dice = app.querySelector("#dice");
    if (dice) {
      dice.onclick = () => roll();
      dice.ontouchend = (e) => { e.preventDefault(); roll(); };
    }
    app.querySelectorAll(".token.legal").forEach(el => {
      el.onclick = () => move(+el.dataset.id);
      el.ontouchend = (e) => { e.preventDefault(); move(+el.dataset.id); };
    });
    fillAds();
    sizeBoard();
    requestAnimationFrame(sizeBoard);
    if (s.phase==="nomove") {
      clearTimeout(nomoveId);
      nomoveId = setTimeout(() => {
        G.state = continueNoMove(G.state);
        if (G.mode==="online" && G.hosting) sendNet({ t:"state", state: G.state });
        render();
      }, 1100);
      return;
    }
    startClock();
    queueBot();
  }

  function waitAnim(ms) {
    return new Promise(function (resolve) {
      var acc = 0;
      var last = performance.now();
      function tick(now) {
        var dt = now - last;
        last = now;
        if (dt > 80) dt = 16;
        acc += dt;
        if (acc >= ms) resolve();
        else requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }
  function roll() {
    const s = G.state; if (!s || s.phase!=="rolling" || G.rolling || G.busy) return;
    if (G.mode==="online" && !isSelfTurn(s) && s.players[s.current].kind!=="bot") return;
    if (G.mode==="online" && !G.hosting) {
      unlock(); S.dice(); G.rolling = true; render();
      sendNet({ t:"roll" });
      return;
    }
    unlock(); S.dice(); G.rolling = true;
    const btn = document.getElementById("dice");
    const read = document.querySelector(".readout");
    if (btn) btn.classList.add("roll");
    if (read) read.textContent = "…";
    const value = 1+Math.floor(Math.random()*6);
    let acc = 0;
    let last = performance.now();
    let flickAcc = 0;
    function flick(now) {
      let dt = now - last;
      last = now;
      if (dt > 80) dt = 16;
      acc += dt;
      flickAcc += dt;
      if (flickAcc > 70) {
        flickAcc = 0;
        if (btn) btn.innerHTML = dieSVG(1+Math.floor(Math.random()*6));
      }
      if (acc < 900) {
        requestAnimationFrame(flick);
        return;
      }
      G.rolling = false;
      G.shown = value;
      G.state = applyRoll(G.state, value);
      if (value===6 && !G.state.event.includes("Three")) S.six();
      if (G.mode==="online" && G.hosting) sendNet({ t:"state", state: G.state });
      render();
    }
    requestAnimationFrame(flick);
  }
  function move(id) {
    const snap = G.state;
    if (!snap || snap.phase!=="picking" || G.rolling || G.busy) return;
    if (G.mode==="online" && !isSelfTurn(snap) && snap.players[snap.current].kind!=="bot") return;
    if (G.mode==="online" && !G.hosting) {
      unlock(); S.move();
      sendNet({ t:"move", tokenId:id });
      return;
    }
    const token = snap.tokens.find(t => t.id===id);
    if (!token) return;
    const res = applyMove(snap, id); if (!res) return;
    unlock(); S.move();
    G.busy = true;
    clearInterval(clockId);
    const cells = walkCells(token, res.from, res.to);
    const el = app.querySelector(`.token[data-id="${id}"]`);
    if (el) el.classList.add("step");
    const finish = () => {
      if (res.caps) S.cap(); if (res.fin) S.home(); if (res.s.phase==="gameover") S.win();
      G.state = res.s; G.busy = false;
      if (G.mode==="online" && G.hosting) sendNet({ t:"state", state: G.state });
      render();
    };
    if (!el || !cells.length) { finish(); return; }
    let i = 0;
    el.style.cssText = posOf(cells[0][0], cells[0][1]);
    void el.offsetWidth;
    function step() {
      i++;
      if (i >= cells.length) { finish(); return; }
      el.style.cssText = posOf(cells[i][0], cells[i][1]);
      waitAnim(150).then(step);
    }
    waitAnim(150).then(step);
  }
  function queueBot() {
    const s = G.state; if (!s || s.phase==="gameover" || s.phase==="nomove" || G.rolling || G.busy) return;
    if (G.mode==="online" && !G.hosting) return;
    if (s.players[s.current].kind!=="bot") return;
    const wait = G.diff==="hard"?900: G.diff==="medium"?700:500;
    clearTimeout(botId);
    botId = setTimeout(() => {
      if (!G.state || G.state.v!==s.v) return;
      if (G.state.phase==="rolling") roll();
      else if (G.state.phase==="picking") move(botPick(G.state, G.diff));
    }, wait);
  }

  window.addEventListener("resize", () => { if (G.screen === "play") sizeBoard(); });
  if (window.parent !== window) document.documentElement.style.setProperty("--chrome-top", "0px");
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState==="visible" && ctx) ctx.resume();
    if (document.visibilityState==="visible" && net && net.peer && net.peer.disconnected && !net.peer.destroyed) {
      try { net.peer.reconnect(); } catch (e) {}
    }
  });
  window.addEventListener("pagehide", () => { try { closeNet(); } catch (e) {} });
  const bootJoin = (new URLSearchParams(location.search).get("join") || "").replace(/[^A-Za-z0-9]/g,"").toUpperCase().slice(0,4);
  if (bootJoin.length === 4) {
    G.joinCode = bootJoin;
    G.tableCode = bootJoin;
    G.hosting = false;
    G.screen = "hosted";
  }
  render();
  </script>
</body>
</html>

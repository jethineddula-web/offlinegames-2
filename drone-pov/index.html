    <!-- No manifest link either: the site has one at the root. A second one
         here would offer to install "Drone POV Flight" as its own app instead
         of OfflineGames. -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Drone POV Flight",
        "url": "https://offlinegames.art/play/drone-pov-flight",
        "description": "Photoreal first-person FPV drone racing across 12 real-world locations with crystal collection, target shooting, combat and a full upgrade shop. Free to play in the browser on mobile and PC.",
        "genre": ["Racing", "Action", "Simulation"],
        "gamePlatform": ["Web browser", "Android", "iOS", "PC"],
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "author": { "@type": "Organization", "name": "offlinegames.art" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- ============ AdSense ============
         data-ad-src, not src. privacy-controls.js turns the loader on only
         where AdSense is allowed to run — never inside the Android app's
         WebView, where Google requires AdMob instead. Loading it directly
         here would put the whole account at risk. -->
    <script async data-ad-src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4203857211510947" crossorigin="anonymous" data-ad-frequency-hint="45s" data-ad-client="ca-pub-4203857211510947"></script>
    <script src="../../privacy-controls.js" defer></script>

    <!-- ============ Three.js — served from this site, not a CDN ============
         It used to load from jsdelivr. That meant the game could not start on
         a first visit without a connection, which is the one thing this site
         promises, and a cross-origin script the service worker cannot cache
         dependably. js/vendor holds three 0.186.0 and only the four
         post-processing addons this game imports. -->
    <script type="importmap">
      {
        "imports": {
          "three": "./js/vendor/three.module.js",
          "three/addons/": "./js/vendor/jsm/"
        }
      }
    </script>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="input-layer" class="off"></div>
      <div id="hud"></div>
      <div id="ui"></div>
    </div>

    <!-- Hard landscape gate for small screens held in portrait -->
    <div id="rotate-gate">
      <div class="grid-bg" style="opacity:.4"></div>
      <div class="phone rel">📱</div>
      <h2 class="rel">ROTATE YOUR DEVICE</h2>
      <p class="rel">Drone POV Flight runs in landscape only. Turn your phone sideways — tap anywhere to force fullscreen landscape.</p>
      <div class="rel tag" style="padding:8px 20px;border:1px solid rgba(255,194,102,.4);border-radius:99px;font-size:11px">TAP TO LOCK LANDSCAPE</div>
    </div>

    <!-- First-paint splash (removed by main.js) -->
    <div id="boot" style="position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 60%,#22262c 0%,#06080b 70%);color:#ffc266;font-family:system-ui,sans-serif;letter-spacing:.35em;font-size:12px">INITIALISING FLIGHT CORE…</div>

    <!-- No service worker is registered here on purpose. The site already runs
         one at the root, network-first, and the vault saves this game's files
         from games-manifest.json. A second worker scoped to this folder would
         serve its own cached copy first and the game would keep showing an old
         build after an update — the exact bug sw.js at the root documents. -->
    <script type="module" src="js/main.js"></script>
  </body>

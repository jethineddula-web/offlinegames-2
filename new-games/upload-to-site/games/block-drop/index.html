<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Block Drop – Free Falling Blocks Puzzle Game | Offline Games</title>
  <meta name="description" content="Play Block Drop free in your browser: stack falling blocks, clear lines, and chase a high score. Hold, ghost piece, touch controls. No download, plays offline." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://offlinegames.art/games/block-drop/" />
  <meta name="theme-color" content="#07071a" />
  <style>
    :root { --bg:#07071a; --panel:#10102b; --line:#22224a; --text:#e8ecff; --dim:#8b93c7; --accent:#22e3ff; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
    body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:8px; padding-bottom:max(8px, env(safe-area-inset-bottom)); }
    .game { display:flex; gap:10px; align-items:flex-start; }
    .side { display:flex; flex-direction:column; gap:8px; width:84px; }
    .box { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px; text-align:center; }
    .box span { display:block; font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:2px; }
    .box b { font-size:17px; font-variant-numeric:tabular-nums; }
    .box canvas { display:block; margin:0 auto; }
    .wrap { position:relative; }
    #board { display:block; background:#0b0b22; border:1px solid var(--line); border-radius:10px; }
    .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:rgba(7,7,26,.85); border-radius:10px; text-align:center; padding:12px; }
    .overlay h1 { font-size:28px; color:var(--accent); letter-spacing:.05em; }
    .overlay p { color:var(--dim); font-size:13px; line-height:1.5; }
    .hidden { display:none !important; }
    .btn { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font:inherit; font-weight:600; cursor:pointer; }
    .btn:hover { border-color:var(--accent); }
    .btn.primary { background:var(--accent); color:#04121a; border-color:var(--accent); }
    .pad { display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; width:min(100%, 420px); }
    .pad button { font-size:20px; padding:12px 0; }
    @media (hover:hover) and (pointer:fine) { .pad { display:none; } }
  </style>
</head>
<body>
  <div class="game">
    <div class="side">
      <div class="box"><span>Hold</span><canvas id="hold"></canvas></div>
      <div class="box"><span>Score</span><b id="score">0</b></div>
      <div class="box"><span>Lines</span><b id="lines">0</b></div>
      <div class="box"><span>Level</span><b id="level">1</b></div>
      <button class="btn" id="pauseBtn" aria-label="Pause">❚❚</button>
    </div>
    <div class="wrap">
      <canvas id="board"></canvas>
      <div class="overlay" id="overlay">
        <h1 id="ovTitle">BLOCK DROP</h1>
        <p id="ovText">Fill rows to clear them.<br>← → move · ↑ rotate · ↓ soft drop<br>Space hard drop · C hold · P pause<br>Touch: tap rotate, swipe to move/drop.</p>
        <button class="btn primary" id="startBtn">Play</button>
      </div>
    </div>
    <div class="side">
      <div class="box"><span>Next</span><canvas id="next"></canvas></div>
      <div class="box"><span>Best</span><b id="best">0</b></div>
    </div>
  </div>
  <div class="pad" id="pad">
    <button class="btn" data-a="left">◀</button>
    <button class="btn" data-a="right">▶</button>
    <button class="btn" data-a="rotate">⟳</button>
    <button class="btn" data-a="soft">▼</button>
    <button class="btn" data-a="drop">⤓</button>
    <button class="btn" data-a="hold">H</button>
  </div>
<script>
(function () {
  "use strict";
  var COLS = 10, ROWS = 20;
  var SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]], O: [[1,0],[2,0],[1,1],[2,1]], T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]], Z: [[0,0],[1,0],[1,1],[2,1]], J: [[0,0],[0,1],[1,1],[2,1]], L: [[2,0],[0,1],[1,1],[2,1]]
  };
  var COLORS = { I:"#22e3ff", O:"#ffd43b", T:"#b98cff", S:"#3dff9e", Z:"#ff4d7d", J:"#4d7dff", L:"#ffa24d" };
  var SIZE = { I:4, O:4, T:3, S:3, Z:3, J:3, L:3 };
  var LINE_PTS = [0, 100, 300, 500, 800];

  var cv = document.getElementById("board"), ctx = cv.getContext("2d");
  var holdCv = document.getElementById("hold"), nextCv = document.getElementById("next");
  var $ = function (id) { return document.getElementById(id); };
  var overlay = $("overlay"), ovTitle = $("ovTitle"), ovText = $("ovText"), startBtn = $("startBtn");
  var cell = 24, grid, cur, bag, nextQ, hold, holdUsed, score, lines, level, running = false, paused = false, over = false;
  var dropAcc = 0, lastT = 0, lockTimer = 0, raf = null;

  function load(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var best = parseInt(load("og-blockdrop-best", "0"), 10) || 0;
  $("best").textContent = best;

  function setupCanvas(c, w, h) {
    var dpr = window.devicePixelRatio || 1;
    c.style.width = w + "px"; c.style.height = h + "px";
    c.width = w * dpr; c.height = h * dpr;
    var g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); return g;
  }
  function resize() {
    var touch = !window.matchMedia("(hover:hover) and (pointer:fine)").matches;
    var availH = window.innerHeight - 20 - (touch ? 70 : 0);
    var availW = window.innerWidth - 16 - 2 * 94;
    cell = Math.max(12, Math.floor(Math.min(availH / ROWS, availW / COLS, 34)));
    ctx = setupCanvas(cv, cell * COLS, cell * ROWS);
    setupCanvas(holdCv, 70, 44); setupCanvas(nextCv, 70, 150);
    draw();
  }

  function refill() {
    var b = Object.keys(SHAPES);
    for (var i = b.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; }
    return b;
  }
  function pull() { if (nextQ.length < 4) nextQ = nextQ.concat(refill()); return nextQ.shift(); }
  function spawn(type) {
    cur = { t:type, cells:SHAPES[type].map(function (c) { return c.slice(); }), x:3, y:type === "I" ? -1 : 0 };
    lockTimer = 0;
    if (collides(cur.cells, cur.x, cur.y)) end();
  }

  function collides(cells, ox, oy) {
    for (var i = 0; i < cells.length; i++) {
      var x = cells[i][0] + ox, y = cells[i][1] + oy;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }
  function move(dx, dy) {
    if (!collides(cur.cells, cur.x + dx, cur.y + dy)) { cur.x += dx; cur.y += dy; if (dx) lockTimer = 0; return true; }
    return false;
  }
  function rotate(dirn) {
    if (cur.t === "O") return;
    var n = SIZE[cur.t];
    var rot = cur.cells.map(function (c) { return dirn > 0 ? [n - 1 - c[1], c[0]] : [c[1], n - 1 - c[0]]; });
    var kicks = [[0,0],[-1,0],[1,0],[0,-1],[-2,0],[2,0],[0,-2]];
    for (var k = 0; k < kicks.length; k++) {
      if (!collides(rot, cur.x + kicks[k][0], cur.y + kicks[k][1])) {
        cur.cells = rot; cur.x += kicks[k][0]; cur.y += kicks[k][1]; lockTimer = 0; return;
      }
    }
  }
  function ghostY() { var y = cur.y; while (!collides(cur.cells, cur.x, y + 1)) y++; return y; }
  function hardDrop() { var d = ghostY() - cur.y; cur.y += d; score += d * 2; lock(); }
  function lock() {
    var topOut = false;
    cur.cells.forEach(function (c) {
      var y = c[1] + cur.y;
      if (y < 0) topOut = true; else grid[y][c[0] + cur.x] = cur.t;
    });
    if (topOut) return end();
    var cleared = 0;
    for (var y = ROWS - 1; y >= 0; y--) {
      if (grid[y].every(Boolean)) { grid.splice(y, 1); grid.unshift(new Array(COLS).fill(null)); cleared++; y++; }
    }
    if (cleared) {
      score += LINE_PTS[cleared] * level;
      lines += cleared;
      level = 1 + Math.floor(lines / 10);
    }
    holdUsed = false;
    updateHud();
    spawn(pull());
  }
  function doHold() {
    if (holdUsed) return;
    var t = cur.t;
    if (hold) spawn(hold); else spawn(pull());
    hold = t; holdUsed = true;
  }
  function interval() { return Math.max(60, 800 * Math.pow(0.85, level - 1)); }

  function updateHud() {
    $("score").textContent = score; $("lines").textContent = lines; $("level").textContent = level;
    if (score > best) { best = score; $("best").textContent = best; save("og-blockdrop-best", best); }
  }

  function block(g, x, y, s, color, alpha) {
    g.globalAlpha = alpha || 1;
    g.fillStyle = color; g.fillRect(x + 1, y + 1, s - 2, s - 2);
    g.fillStyle = "rgba(255,255,255,.25)"; g.fillRect(x + 1, y + 1, s - 2, Math.max(2, s * 0.18));
    g.globalAlpha = 1;
  }
  function drawMini(c, type, h) {
    var g = c.getContext("2d"), dpr = window.devicePixelRatio || 1;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, 70, h);
    if (!type) return;
    var s = 14, cs = SHAPES[type];
    var minX = Math.min.apply(null, cs.map(function (p) { return p[0]; })), maxX = Math.max.apply(null, cs.map(function (p) { return p[0]; }));
    var minY = Math.min.apply(null, cs.map(function (p) { return p[1]; })), maxY = Math.max.apply(null, cs.map(function (p) { return p[1]; }));
    var ox = (70 - (maxX - minX + 1) * s) / 2, oy = (44 - (maxY - minY + 1) * s) / 2;
    return function (yOff) { cs.forEach(function (p) { block(g, ox + (p[0] - minX) * s, yOff + oy + (p[1] - minY) * s, s, COLORS[type]); }); };
  }

  function draw() {
    if (!ctx) return;
    var W = cell * COLS, H = cell * ROWS;
    ctx.fillStyle = "#0b0b22"; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "#15153a"; ctx.lineWidth = 1;
    for (var x = 1; x < COLS; x++) { ctx.beginPath(); ctx.moveTo(x * cell + .5, 0); ctx.lineTo(x * cell + .5, H); ctx.stroke(); }
    for (var y = 1; y < ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y * cell + .5); ctx.lineTo(W, y * cell + .5); ctx.stroke(); }
    if (!grid) return;
    for (y = 0; y < ROWS; y++) for (x = 0; x < COLS; x++) if (grid[y][x]) block(ctx, x * cell, y * cell, cell, over ? "#555a7a" : COLORS[grid[y][x]]);
    if (cur && !over) {
      var gy = ghostY();
      cur.cells.forEach(function (c) { if (c[1] + gy >= 0) block(ctx, (c[0] + cur.x) * cell, (c[1] + gy) * cell, cell, COLORS[cur.t], 0.22); });
      cur.cells.forEach(function (c) { if (c[1] + cur.y >= 0) block(ctx, (c[0] + cur.x) * cell, (c[1] + cur.y) * cell, cell, COLORS[cur.t]); });
    }
    var hd = drawMini(holdCv, hold, 44); if (hd) hd(0);
    var g = nextCv.getContext("2d"), dpr = window.devicePixelRatio || 1;
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, 70, 150);
    for (var i = 0; i < 3 && nextQ && i < nextQ.length; i++) {
      var f = (function (type, off) {
        var s = 13, cs = SHAPES[type];
        var minX = Math.min.apply(null, cs.map(function (p) { return p[0]; })), maxX = Math.max.apply(null, cs.map(function (p) { return p[0]; }));
        var minY = Math.min.apply(null, cs.map(function (p) { return p[1]; })), maxY = Math.max.apply(null, cs.map(function (p) { return p[1]; }));
        var ox = (70 - (maxX - minX + 1) * s) / 2, oy = (50 - (maxY - minY + 1) * s) / 2;
        cs.forEach(function (p) { block(g, ox + (p[0] - minX) * s, off + oy + (p[1] - minY) * s, s, COLORS[type]); });
      });
      f(nextQ[i], i * 50);
    }
  }

  function loop(t) {
    raf = requestAnimationFrame(loop);
    if (!running || paused) { lastT = t; return; }
    var dt = Math.min(100, t - (lastT || t)); lastT = t;
    dropAcc += dt;
    if (dropAcc >= interval()) {
      dropAcc = 0;
      move(0, 1);
    }
    if (collides(cur.cells, cur.x, cur.y + 1)) {
      lockTimer += dt;
      if (lockTimer > 500) lock();
    } else lockTimer = 0;
    draw();
  }

  function start() {
    grid = []; for (var y = 0; y < ROWS; y++) grid.push(new Array(COLS).fill(null));
    nextQ = refill(); hold = null; holdUsed = false; score = 0; lines = 0; level = 1; over = false;
    updateHud();
    spawn(pull());
    running = true; paused = false; dropAcc = 0;
    overlay.classList.add("hidden");
    draw();
  }
  function end() {
    over = true; running = false;
    draw();
    ovTitle.textContent = "GAME OVER";
    ovText.innerHTML = "Score: <b>" + score + "</b> · Lines: <b>" + lines + "</b><br>Best: <b>" + best + "</b>";
    startBtn.textContent = "Play again";
    overlay.classList.remove("hidden");
  }
  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      ovTitle.textContent = "PAUSED"; ovText.textContent = "Press P or tap Resume."; startBtn.textContent = "Resume";
      overlay.classList.remove("hidden");
    } else overlay.classList.add("hidden");
  }

  function act(a) {
    if (!running || paused) return;
    if (a === "left") move(-1, 0);
    else if (a === "right") move(1, 0);
    else if (a === "rotate") rotate(1);
    else if (a === "rotateL") rotate(-1);
    else if (a === "soft") { if (move(0, 1)) { score += 1; dropAcc = 0; updateHud(); } }
    else if (a === "drop") { hardDrop(); updateHud(); }
    else if (a === "hold") doHold();
    draw();
  }

  startBtn.addEventListener("click", function () { if (paused) togglePause(); else start(); });
  $("pauseBtn").addEventListener("click", togglePause);
  var KEYS = { ArrowLeft:"left", KeyA:"left", ArrowRight:"right", KeyD:"right", ArrowUp:"rotate", KeyX:"rotate", KeyW:"rotate", KeyZ:"rotateL",
               ArrowDown:"soft", KeyS:"soft", Space:"drop", KeyC:"hold", ShiftLeft:"hold", ShiftRight:"hold" };
  document.addEventListener("keydown", function (e) {
    if (e.code === "KeyP" || e.code === "Escape") { e.preventDefault(); togglePause(); return; }
    if (!running && (e.code === "Enter" || e.code === "Space")) { e.preventDefault(); start(); return; }
    if (KEYS[e.code]) { e.preventDefault(); act(KEYS[e.code]); }
  });

  // on-screen pad with auto-repeat for move/soft-drop
  document.querySelectorAll("#pad button").forEach(function (b) {
    var rep = null, first = null;
    function stop() { clearTimeout(first); clearInterval(rep); }
    b.addEventListener("pointerdown", function (e) {
      e.preventDefault(); act(b.dataset.a);
      if (/left|right|soft/.test(b.dataset.a)) first = setTimeout(function () { rep = setInterval(function () { act(b.dataset.a); }, 55); }, 180);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) { b.addEventListener(ev, stop); });
  });

  // gestures on the board: tap rotate, drag sideways to move, flick down to drop
  var tx = 0, ty = 0, tt = 0, moved = 0, softSteps = 0;
  cv.addEventListener("touchstart", function (e) { var p = e.touches[0]; tx = p.clientX; ty = p.clientY; tt = Date.now(); moved = 0; softSteps = 0; }, { passive:true });
  cv.addEventListener("touchmove", function (e) {
    var p = e.touches[0], dx = p.clientX - tx, dy = p.clientY - ty;
    while (Math.abs(dx) >= cell) { act(dx > 0 ? "right" : "left"); tx += dx > 0 ? cell : -cell; dx = p.clientX - tx; moved++; }
    while (dy >= cell) { act("soft"); ty += cell; dy = p.clientY - ty; moved++; softSteps++; }
  }, { passive:true });
  cv.addEventListener("touchend", function (e) {
    var p = e.changedTouches[0], dt = Date.now() - tt, dy = p.clientY - ty;
    if (!moved && dt < 250 && Math.abs(p.clientX - tx) < 10 && Math.abs(dy) < 10) act("rotate");
    else if (dt < 250 && softSteps >= 1 && dy >= 0) act("drop");
  });

  document.addEventListener("visibilitychange", function () { if (document.hidden && running && !paused) togglePause(); });
  window.addEventListener("resize", resize);
  nextQ = [];
  resize();
  raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>

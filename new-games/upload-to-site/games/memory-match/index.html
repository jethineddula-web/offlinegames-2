<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Memory Match – Free Card Matching Game | Offline Games</title>
  <meta name="description" content="Play Memory Match free in your browser: flip cards, find pairs, and beat your best moves and time. Three board sizes. No download, no signup, plays offline." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://offlinegames.art/games/memory-match/" />
  <meta name="theme-color" content="#07071a" />
  <style>
    :root { --bg:#07071a; --panel:#10102b; --line:#22224a; --text:#e8ecff; --dim:#8b93c7; --accent:#22e3ff; --good:#3dff9e; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; }
    body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:10px; padding-bottom:max(10px, env(safe-area-inset-bottom)); }
    .bar { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
    .btn { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
    .btn:hover { border-color:var(--accent); }
    .btn.on { border-color:var(--accent); color:var(--accent); }
    .hud { display:flex; gap:8px; }
    .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px 12px; min-width:84px; text-align:center; }
    .stat span { display:block; font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
    .stat b { font-size:18px; font-variant-numeric:tabular-nums; }
    .grid { display:grid; gap:8px; }
    .card { perspective:600px; cursor:pointer; }
    .inner { position:relative; width:100%; height:100%; transition:transform .35s; transform-style:preserve-3d; }
    .card.up .inner, .card.done .inner { transform:rotateY(180deg); }
    .face { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:12px; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
    .back { background:linear-gradient(135deg,#1c1f55,#2d1b5e); border:1px solid #3a3f8a; }
    .back::after { content:"?"; color:#5a60b0; font-weight:800; font-size:1.2em; }
    .front { background:#141438; border:1px solid var(--line); transform:rotateY(180deg); }
    .card.done .front { border-color:var(--good); box-shadow:0 0 12px rgba(61,255,158,.35); }
    .card:focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:12px; }
    .msg { min-height:22px; color:var(--dim); font-size:14px; text-align:center; }
    .msg b { color:var(--good); }
    @media (prefers-reduced-motion: reduce) { .inner { transition:none; } }
  </style>
</head>
<body>
  <div class="bar" id="sizes">
    <button class="btn" data-size="4x4">Easy 4×4</button>
    <button class="btn" data-size="4x5">Medium 4×5</button>
    <button class="btn" data-size="6x6">Hard 6×6</button>
    <button class="btn" id="restart">↻ New</button>
  </div>
  <div class="hud">
    <div class="stat"><span>Moves</span><b id="moves">0</b></div>
    <div class="stat"><span>Time</span><b id="time">0</b></div>
    <div class="stat"><span>Pairs</span><b id="pairs">0</b></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg">Flip two cards. Match all the pairs.</div>
<script>
(function () {
  "use strict";
  var ICONS = ["🍎","🚀","🐙","🎸","🌵","🦊","🍩","⚽","🎈","🐢","🌙","🍉","🦋","🎲","🔥","🐳","🍄","⭐"];
  var gridEl = document.getElementById("grid"), msg = document.getElementById("msg");
  var movesEl = document.getElementById("moves"), timeEl = document.getElementById("time"), pairsEl = document.getElementById("pairs");
  var size, cols, rows, deck, open, matched, moves, t0, timer, lock;

  function load(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function newGame(s) {
    size = s || size || load("og-memory-size", "4x4");
    if (!/^(4x4|4x5|6x6)$/.test(size)) size = "4x4";
    save("og-memory-size", size);
    var p = size.split("x"); cols = +p[0]; rows = +p[1];
    var n = cols * rows / 2;
    var picks = shuffle(ICONS.slice()).slice(0, n);
    deck = shuffle(picks.concat(picks));
    open = []; matched = 0; moves = 0; lock = false; t0 = 0;
    clearInterval(timer);
    movesEl.textContent = 0; timeEl.textContent = 0; pairsEl.textContent = "0/" + n;
    var b = load("og-memory-best-" + size, "");
    msg.innerHTML = b ? "Best on " + size + ": <b>" + b.replace("|", " moves, ") + "s</b>" : "Flip two cards. Match all the pairs.";
    document.querySelectorAll("#sizes [data-size]").forEach(function (e) { e.classList.toggle("on", e.dataset.size === size); });
    build();
  }

  function build() {
    var gap = 8;
    var cw = Math.floor(Math.min((window.innerWidth - 20 - gap * (cols - 1)) / cols, (window.innerHeight - 190 - gap * (rows - 1)) / rows, 110));
    cw = Math.max(40, cw);
    gridEl.style.gridTemplateColumns = "repeat(" + cols + "," + cw + "px)";
    gridEl.innerHTML = "";
    deck.forEach(function (icon, i) {
      var c = document.createElement("div");
      c.className = "card"; c.tabIndex = 0; c.dataset.i = i;
      c.setAttribute("role", "button"); c.setAttribute("aria-label", "Card " + (i + 1));
      c.style.width = c.style.height = cw + "px";
      c.style.fontSize = Math.round(cw * 0.5) + "px";
      c.innerHTML = '<div class="inner"><div class="face back"></div><div class="face front">' + icon + "</div></div>";
      gridEl.appendChild(c);
    });
  }

  function flip(el) {
    if (lock || el.classList.contains("up") || el.classList.contains("done")) return;
    if (!t0) { t0 = Date.now(); timer = setInterval(function () { timeEl.textContent = Math.floor((Date.now() - t0) / 1000); }, 250); }
    el.classList.add("up"); open.push(el);
    el.setAttribute("aria-label", "Card " + (+el.dataset.i + 1) + ": " + deck[el.dataset.i]);
    if (open.length < 2) return;
    moves++; movesEl.textContent = moves;
    var a = open[0], b = open[1];
    if (deck[a.dataset.i] === deck[b.dataset.i]) {
      a.classList.add("done"); b.classList.add("done"); a.classList.remove("up"); b.classList.remove("up");
      open = []; matched++;
      pairsEl.textContent = matched + "/" + deck.length / 2;
      if (matched === deck.length / 2) win();
    } else {
      lock = true;
      setTimeout(function () {
        a.classList.remove("up"); b.classList.remove("up");
        a.setAttribute("aria-label", "Card " + (+a.dataset.i + 1)); b.setAttribute("aria-label", "Card " + (+b.dataset.i + 1));
        open = []; lock = false;
      }, 750);
    }
  }

  function win() {
    clearInterval(timer);
    var secs = Math.max(1, Math.round((Date.now() - t0) / 1000));
    timeEl.textContent = secs;
    var key = "og-memory-best-" + size, prev = load(key, "");
    var pm = prev ? +prev.split("|")[0] : Infinity, ps = prev ? +prev.split("|")[1] : Infinity;
    if (moves < pm || (moves === pm && secs < ps)) { save(key, moves + "|" + secs); msg.innerHTML = "<b>New best!</b> " + moves + " moves in " + secs + "s"; }
    else msg.innerHTML = "Done in " + moves + " moves, " + secs + "s. Best: " + pm + " moves, " + ps + "s";
  }

  gridEl.addEventListener("click", function (e) { var c = e.target.closest(".card"); if (c) flip(c); });
  gridEl.addEventListener("keydown", function (e) {
    var c = e.target.closest(".card"); if (!c) return;
    var i = +c.dataset.i, n = null;
    if (e.code === "Enter" || e.code === "Space") { e.preventDefault(); flip(c); return; }
    if (e.code === "ArrowRight") n = i + 1; else if (e.code === "ArrowLeft") n = i - 1;
    else if (e.code === "ArrowDown") n = i + cols; else if (e.code === "ArrowUp") n = i - cols;
    if (n !== null && gridEl.children[n]) { e.preventDefault(); gridEl.children[n].focus(); }
  });
  document.querySelectorAll("#sizes [data-size]").forEach(function (b) { b.addEventListener("click", function () { newGame(b.dataset.size); }); });
  document.getElementById("restart").addEventListener("click", function () { newGame(); });
  var rz = null;
  window.addEventListener("resize", function () {
    clearTimeout(rz);
    rz = setTimeout(function () {
      var state = Array.prototype.map.call(gridEl.children, function (c) { return c.className; });
      build();
      Array.prototype.forEach.call(gridEl.children, function (c, i) { c.className = state[i]; });
      open = open.map(function (o) { return gridEl.children[o.dataset.i]; });
    }, 150);
  });
  newGame();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Minesweeper – Free Classic Minesweeper Online | Offline Games</title>
  <meta name="description" content="Play classic Minesweeper free in your browser. Three difficulty levels, safe first click, flag mode for phones. No download, no signup, plays offline." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://offlinegames.art/games/minesweeper/" />
  <meta name="theme-color" content="#07071a" />
  <style>
    :root { --bg:#07071a; --panel:#10102b; --line:#22224a; --text:#e8ecff; --dim:#8b93c7; --accent:#22e3ff; --hidden:#2a2d63; --hiddenHi:#363a7d; --open:#12122e; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; }
    body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:10px; padding-bottom:max(10px, env(safe-area-inset-bottom)); }
    .bar { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; }
    .btn { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
    .btn:hover { border-color:var(--accent); }
    .btn.on { border-color:var(--accent); color:var(--accent); }
    .hud { display:flex; gap:8px; align-items:center; }
    .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px 12px; min-width:74px; text-align:center; font-variant-numeric:tabular-nums; font-weight:700; font-size:18px; }
    .face { font-size:22px; padding:4px 10px; }
    .board { display:grid; gap:2px; background:var(--line); border:2px solid var(--line); border-radius:10px; overflow:hidden; touch-action:manipulation; }
    .c { display:flex; align-items:center; justify-content:center; font-weight:800; background:var(--hidden); cursor:pointer; line-height:1; }
    .c.h:hover { background:var(--hiddenHi); }
    .c.o { background:var(--open); cursor:default; }
    .c.boom { background:#8a1633; }
    .c.wrong { background:#4a2a10; }
    .n1{color:#4db8ff}.n2{color:#3dff9e}.n3{color:#ff5a7a}.n4{color:#b98cff}.n5{color:#ffb347}.n6{color:#22e3ff}.n7{color:#fff}.n8{color:#9aa0c8}
    .msg { min-height:20px; color:var(--dim); font-size:14px; text-align:center; }
    .msg b { color:var(--accent); }
  </style>
</head>
<body>
  <div class="bar" id="levels">
    <button class="btn" data-lvl="easy">Easy</button>
    <button class="btn" data-lvl="medium">Medium</button>
    <button class="btn" data-lvl="hard">Hard</button>
  </div>
  <div class="hud">
    <div class="stat" title="Mines left">💣 <span id="left">0</span></div>
    <button class="btn face" id="face" aria-label="New game">🙂</button>
    <div class="stat" title="Time">⏱ <span id="time">0</span></div>
    <button class="btn" id="flagBtn" aria-pressed="false" title="Flag mode (for touch)">🚩 Off</button>
  </div>
  <div class="board" id="board"></div>
  <div class="msg" id="msg">Tap to dig. Right-click, long-press, or use 🚩 mode to flag.</div>
<script>
(function () {
  "use strict";
  var LEVELS = { easy:{w:9,h:9,m:10}, medium:{w:16,h:16,m:40}, hard:{w:30,h:16,m:99} };
  var boardEl = document.getElementById("board"), leftEl = document.getElementById("left"), timeEl = document.getElementById("time");
  var face = document.getElementById("face"), msg = document.getElementById("msg"), flagBtn = document.getElementById("flagBtn");
  var lvlName, W, H, M, cells, els, started, over, flags, opened, t0, timer, flagMode = false;

  function load(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function idx(x, y) { return y * W + x; }
  function neighbors(i) {
    var x = i % W, y = (i / W) | 0, out = [];
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      var nx = x + dx, ny = y + dy;
      if (nx >= 0 && ny >= 0 && nx < W && ny < H) out.push(idx(nx, ny));
    }
    return out;
  }

  function newGame(name) {
    lvlName = name || lvlName || load("og-mines-level", "easy");
    if (!LEVELS[lvlName]) lvlName = "easy";
    save("og-mines-level", lvlName);
    var L = LEVELS[lvlName];
    // On tall screens, stand the wide board up so it fits
    var portrait = window.innerHeight > window.innerWidth;
    W = portrait && L.w > L.h ? L.h : L.w;
    H = portrait && L.w > L.h ? L.w : L.h;
    M = L.m;
    cells = []; for (var i = 0; i < W * H; i++) cells.push({ mine:false, n:0, open:false, flag:false });
    started = false; over = false; flags = 0; opened = 0;
    clearInterval(timer); timeEl.textContent = 0; leftEl.textContent = M; face.textContent = "🙂";
    var b = load("og-mines-best-" + lvlName, "");
    msg.innerHTML = b ? "Best time on " + lvlName + ": <b>" + b + "s</b>" : "Tap to dig. Right-click, long-press, or use 🚩 mode to flag.";
    document.querySelectorAll("#levels .btn").forEach(function (e) { e.classList.toggle("on", e.dataset.lvl === lvlName); });
    build();
  }

  function build() {
    var sz = Math.floor(Math.min((window.innerWidth - 24) / W, (window.innerHeight - 170) / H)) - 2;
    sz = Math.max(18, Math.min(38, sz));
    boardEl.style.gridTemplateColumns = "repeat(" + W + "," + sz + "px)";
    boardEl.innerHTML = "";
    els = [];
    for (var i = 0; i < W * H; i++) {
      var d = document.createElement("div");
      d.className = "c h"; d.dataset.i = i;
      d.style.width = d.style.height = sz + "px";
      d.style.fontSize = Math.round(sz * 0.55) + "px";
      boardEl.appendChild(d); els.push(d);
    }
  }

  function plant(safe) {
    var banned = {}; banned[safe] = 1; neighbors(safe).forEach(function (n) { banned[n] = 1; });
    var pool = []; for (var i = 0; i < W * H; i++) if (!banned[i]) pool.push(i);
    for (var k = 0; k < M; k++) {
      var j = k + Math.floor(Math.random() * (pool.length - k));
      var t = pool[k]; pool[k] = pool[j]; pool[j] = t;
      cells[pool[k]].mine = true;
    }
    cells.forEach(function (c, i) { c.n = neighbors(i).filter(function (n) { return cells[n].mine; }).length; });
    started = true; t0 = Date.now();
    timer = setInterval(function () { timeEl.textContent = Math.min(999, Math.floor((Date.now() - t0) / 1000)); }, 250);
  }

  function paint(i) {
    var c = cells[i], e = els[i];
    e.className = "c" + (c.open ? " o" : " h");
    e.textContent = "";
    if (c.open) {
      if (c.mine) e.textContent = "💣";
      else if (c.n) { e.textContent = c.n; e.classList.add("n" + c.n); }
    } else if (c.flag) e.textContent = "🚩";
  }

  function reveal(i) {
    var stack = [i];
    while (stack.length) {
      var j = stack.pop(), c = cells[j];
      if (c.open || c.flag) continue;
      c.open = true; opened++; paint(j);
      if (!c.mine && c.n === 0) neighbors(j).forEach(function (n) { if (!cells[n].open) stack.push(n); });
    }
  }

  function dig(i) {
    if (over) return;
    var c = cells[i];
    if (!started) plant(i);
    if (c.flag) return;
    if (c.open) {
      // chord: open neighbours when the right number of flags are placed
      if (!c.n) return;
      var nb = neighbors(i), f = nb.filter(function (n) { return cells[n].flag; }).length;
      if (f !== c.n) return;
      nb.forEach(function (n) { if (!cells[n].flag && !cells[n].open) { if (cells[n].mine) return lose(n); reveal(n); } });
    } else {
      if (c.mine) return lose(i);
      reveal(i);
    }
    if (!over && opened === W * H - M) win();
  }

  function flag(i) {
    if (over || cells[i].open) return;
    cells[i].flag = !cells[i].flag;
    flags += cells[i].flag ? 1 : -1;
    leftEl.textContent = M - flags;
    paint(i);
  }

  function lose(i) {
    over = true; clearInterval(timer); face.textContent = "😵";
    cells.forEach(function (c, j) {
      if (c.mine && !c.flag) { c.open = true; paint(j); }
      else if (!c.mine && c.flag) { els[j].classList.add("wrong"); els[j].textContent = "❌"; }
    });
    els[i].classList.add("boom");
    msg.textContent = "Boom! Tap the face to try again.";
  }

  function win() {
    over = true; clearInterval(timer); face.textContent = "😎";
    var secs = Math.max(1, Math.round((Date.now() - t0) / 1000));
    timeEl.textContent = Math.min(999, secs);
    cells.forEach(function (c, j) { if (c.mine && !c.flag) { c.flag = true; paint(j); } });
    leftEl.textContent = 0;
    var key = "og-mines-best-" + lvlName, prev = parseInt(load(key, "0"), 10);
    if (!prev || secs < prev) { save(key, secs); msg.innerHTML = "Cleared in <b>" + secs + "s</b> — new best!"; }
    else msg.innerHTML = "Cleared in <b>" + secs + "s</b>. Best: " + prev + "s";
  }

  // Input: click digs (or flags in flag mode), right-click flags, long-press flags
  var pressTimer = null, longFired = false;
  boardEl.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  boardEl.addEventListener("pointerdown", function (e) {
    var t = e.target.closest(".c"); if (!t) return;
    var i = +t.dataset.i; longFired = false;
    if (e.button === 2) { flag(i); longFired = true; return; }
    if (e.pointerType !== "mouse") {
      pressTimer = setTimeout(function () { longFired = true; flag(i); if (navigator.vibrate) navigator.vibrate(30); }, 380);
    }
    if (!over) face.textContent = "😮";
  });
  function cancelPress() { clearTimeout(pressTimer); pressTimer = null; }
  boardEl.addEventListener("pointerleave", cancelPress);
  boardEl.addEventListener("pointercancel", cancelPress);
  boardEl.addEventListener("pointerup", function (e) {
    cancelPress();
    if (!over) face.textContent = "🙂";
    var t = e.target.closest(".c"); if (!t || longFired || e.button === 2) return;
    var i = +t.dataset.i;
    if (flagMode && !cells[i].open) flag(i); else dig(i);
  });

  face.addEventListener("click", function () { newGame(); });
  flagBtn.addEventListener("click", function () {
    flagMode = !flagMode;
    flagBtn.textContent = "🚩 " + (flagMode ? "On" : "Off");
    flagBtn.classList.toggle("on", flagMode);
    flagBtn.setAttribute("aria-pressed", flagMode);
  });
  document.querySelectorAll("#levels .btn").forEach(function (b) {
    b.addEventListener("click", function () { newGame(b.dataset.lvl); });
  });
  document.addEventListener("keydown", function (e) {
    if (e.code === "KeyR" || e.code === "F2") { e.preventDefault(); newGame(); }
    if (e.code === "KeyF") flagBtn.click();
  });
  var rz = null;
  window.addEventListener("resize", function () {
    clearTimeout(rz);
    rz = setTimeout(function () {
      var L = LEVELS[lvlName], portrait = window.innerHeight > window.innerWidth;
      var wantW = portrait && L.w > L.h ? L.h : L.w;
      if (!started && wantW !== W) { newGame(); return; }
      build(); cells.forEach(function (c, i) { paint(i); });
    }, 150);
  });
  newGame();
})();
</script>
</body>
</html>
